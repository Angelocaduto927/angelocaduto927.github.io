<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hongrui Yin · Website moved</title>
  <link rel="canonical" href="https://hongruiyin.github.io/">
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 38rem; margin: 12vh auto 0; padding: 0 1.5rem; }
    h1 { font-size: 1.75rem; }
    a { text-underline-offset: .15em; }
  </style>
</head>
<body>
  <main>
    <h1>Hongrui Yin’s website has moved</h1>
    <p>Continue to <a id="new-homepage" href="https://hongruiyin.github.io/">hongruiyin.github.io</a>.</p>
  </main>
  <script>
    const link = document.getElementById('new-homepage');
    const destination = new URL(link.href);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    link.href = destination.href;
    window.location.replace(destination.href);
  </script>
</body>
</html>
